<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lofi Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Ambient orbs -->
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <main class="popup">
      <!-- Header -->
      <header class="head">
        <span class="dot"></span>
        <h1>lofi</h1>
        <span class="head-sub">music player</span>
      </header>

      <!-- Add URL form -->
      <form id="add-form" class="add-form">
        <input id="url-input" type="url" placeholder="Paste a YouTube URL…" autocomplete="off" required />
        <button type="submit" id="add-btn" aria-label="Add URL">+</button>
      </form>

      <!-- Track list -->
      <ul id="list" class="list"></ul>

      <!-- Player stage -->
      <div id="player-stage" class="player-stage">
        <div class="album-art">
          <img id="thumb" class="thumb hidden" alt="Thumbnail" />
          <span id="thumb-note" class="thumb-note">&#9835;</span>
        </div>
        <div class="player-info">
          <p id="track-title" class="track-title">Nothing playing</p>
          <p id="player-status" class="player-status idle"></p>
          <div id="progress-container" class="progress-container hidden">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>
        <div class="player-controls">
          <button id="play-pause" class="play-pause" aria-label="Play">▶</button>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="clear-list" type="button" class="ghost">Clear all</button>
      </div>

      <section class="settings">
        <h2>Settings</h2>
        <label for="music-dir">Download directory</label>
        <div class="dir-row">
          <input id="music-dir" type="text" placeholder="Relative path inside extension (e.g. music)" />
          <button id="save-music-dir" type="button" class="ghost">Save</button>
        </div>
        <small>Set where the native host should save downloaded MP3s (native host must support changing directory).</small>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
